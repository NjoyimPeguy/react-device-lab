name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'NjoyimPeguy/react-device-lab'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --ipc=host
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run verify
      - run: npm run release:check -- "${{ github.event.release.tag_name }}"
      - name: Pack the verified release artifact
        id: pack
        shell: bash
        run: |
          tarball="$(npm pack --ignore-scripts --silent)"
          test -f "$tarball"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
      - name: Publish the verified release artifact
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --ignore-scripts --access public
        env:
          # Temporary fallback for the first publication, before npm can attach
          # a trusted publisher to the newly created package.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
