name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'NjoyimPeguy/react-device-lab'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run verify
      - run: npm run release:check -- "${{ github.event.release.tag_name }}"
      - name: Pack the verified release artifact
        id: pack
        shell: bash
        run: |
          tarball="$(npm pack --ignore-scripts --silent)"
          test -f "$tarball"
          test ! -e "release-package.tgz"
          mv -- "$tarball" "release-package.tgz"
          test -f "release-package.tgz"
      - name: Upload the verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-package.tgz
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.repository == 'NjoyimPeguy/react-device-lab'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Download the verified release artifact
        uses: actions/download-artifact@v5
        with:
          name: release-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-artifact
      - name: Publish the verified release artifact
        run: |
          test -f "./package-artifact/release-package.tgz"
          npm publish "./package-artifact/release-package.tgz" --ignore-scripts --access public
