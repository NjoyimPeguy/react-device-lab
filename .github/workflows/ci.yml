name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  react-peer-range:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-version:
          - "18.3.1"
          - "19.2.8"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
