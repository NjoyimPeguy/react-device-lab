name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify

  react-peer-range:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-version:
          - "18.3.1"
          - "19.2.8"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
